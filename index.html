    <!-- HoshiYaar GA4 Helper -->
    <script>
      window.hyTrack = function(eventName, params = {}) {
        // meta_user_id is only for Meta de-duplication; it is not sent to GA
        const { meta_user_id, ...gaParams } = params || {};
        if (typeof gtag === "function") {
          gtag("event", eventName, { ...gaParams });
        }

        // Facebook Event Tracking
        if (eventName === "sign_up") {
          // 1. Web Pixel. The backend sends the same sign-up through the Conversions API with
          //    event ID "CompleteRegistration_<userId>"; the same ID here lets Meta count it once.
          if (typeof fbq === "function") {
            if (meta_user_id) {
              fbq('track', 'CompleteRegistration', {}, { eventID: 'CompleteRegistration_' + meta_user_id });
            } else {
              fbq('track', 'CompleteRegistration');
            }
          }
          // 2. Native Android Bridge
          if (window.NativeFB && typeof window.NativeFB.logSignup === "function") {
            window.NativeFB.logSignup();
          }
        } else if (eventName === "app_open") {
          // Track app_open for retargeting unconverted users
          if (typeof fbq === "function") {
            fbq('trackCustom', 'AppOpen');
          }
        }
      };
    </script>

      <!-- Shown from the very first frame, before the app's code has loaded; React replaces it.
           Uses only what is inside the app (no internet needed). -->
      <style>
        /* Same look as the app's loader (components/ui/HyLoader.jsx): a CSS rolling cube, no images */
        #hy-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          background:radial-gradient(70vw 70vw at 110% -10%,rgba(255,255,255,.7),transparent 58%),radial-gradient(55vw 55vw at -15% -20%,rgba(255,255,255,.6),transparent 56%),#EAF1FB;
          font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;z-index:1}
        #hy-boot .s{position:relative;width:190px;height:170px;perspective:880px}
        #hy-boot .t{position:absolute;left:8px;right:8px;bottom:14px;height:2px;background:linear-gradient(90deg,transparent,rgba(37,99,235,.45),transparent)}
        #hy-boot .sh{position:absolute;left:50%;margin-left:-44px;bottom:9px;width:88px;height:12px;border-radius:50%;
          background:radial-gradient(ellipse at center,rgba(30,58,138,.35),rgba(30,58,138,0) 72%);animation:hbS 1.4s infinite cubic-bezier(.58,.08,.45,.93)}
        #hy-boot .c{position:absolute;left:50%;bottom:24px;width:64px;height:64px;margin-left:-32px;transform-style:preserve-3d;
          transform:rotateX(-8deg) rotateY(8deg);animation:hbR 1.4s infinite cubic-bezier(.58,.08,.45,.93)}
        #hy-boot .f{position:absolute;inset:0;border:1px solid rgba(29,78,216,.25);border-radius:6px;backface-visibility:hidden}
        #hy-boot .f1{transform:translateZ(32px);background:linear-gradient(145deg,#93C5FD,#3B82F6 45%,#1D4ED8)}
        #hy-boot .f2{transform:rotateY(90deg) translateZ(32px);background:linear-gradient(160deg,#60A5FA,#1E40AF 74%)}
        #hy-boot .f3{transform:rotateX(90deg) translateZ(32px);background:linear-gradient(160deg,#BFDBFE,#3B82F6 68%)}
        #hy-boot p{margin:18px 0 0;font-size:20px;font-weight:700;color:#0F1F3D}
        @keyframes hbR{0%{transform:translateY(0) rotateX(-8deg) rotateY(8deg) rotateZ(0)}11%{transform:translateY(-14px) rotateX(-8deg) rotateY(8deg) rotateZ(46deg)}
          22%,28%{transform:translateY(0) rotateX(-8deg) rotateY(8deg) rotateZ(90deg)}37.5%{transform:translateY(-14px) rotateX(-8deg) rotateY(8deg) rotateZ(136deg)}
          47%,53%{transform:translateY(0) rotateX(-8deg) rotateY(8deg) rotateZ(180deg)}62.5%{transform:translateY(-14px) rotateX(-8deg) rotateY(8deg) rotateZ(226deg)}
          72%,78%{transform:translateY(0) rotateX(-8deg) rotateY(8deg) rotateZ(270deg)}87.5%{transform:translateY(-14px) rotateX(-8deg) rotateY(8deg) rotateZ(316deg)}
          97%,100%{transform:translateY(0) rotateX(-8deg) rotateY(8deg) rotateZ(360deg)}}
        @keyframes hbS{0%,22%,28%,47%,53%,72%,78%,97%,100%{transform:scaleX(.9);opacity:.55}11%,37.5%,62.5%,87.5%{transform:scaleX(.7);opacity:.3}}
        @media (prefers-reduced-motion:reduce){#hy-boot .c,#hy-boot .sh{animation:none}}
